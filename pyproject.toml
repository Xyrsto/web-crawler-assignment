[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-crawler"
version = "0.1.0"
description = "A fast, polite, single-domain web crawler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    # aiodns needs a selector event loop, which is not the default on Windows.
    "aiodns>=3.2; sys_platform != 'win32'",
    "Brotli>=1.1",
    "selectolax>=0.3.21",
]

[project.scripts]
web-crawler = "web_crawler.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-aiohttp>=1.0.5",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/web_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["web_crawler"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks"]
mypy_path = "src"
